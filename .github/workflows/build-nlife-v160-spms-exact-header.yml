name: Build N-Life v1.6.0 SPMS Exact Header APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract N-Life v1.6.0 package
        run: |
          rm -rf extracted
          mkdir extracted
          ZIP_FILE="N-Life_v1.6.0_SPMS_exact_header_lock.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; exit 1; }
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name pubspec.yaml -print -quit)")
          test -n "$PROJECT_DIR" || { echo "pubspec.yaml not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create stable Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.example --project-name n_life .
          rm -rf test

      - name: Apply app identity, notifications, widget, and fixed signing
        run: |
          cd "$PROJECT_DIR"

          sed -i 's/android:label="[^"]*"/android:label="N-Life"/g' android/app/src/main/AndroidManifest.xml

          if [ -d android_icons ]; then
            cp -R android_icons/* android/app/src/main/res/
          fi

          mkdir -p android/app/src/main/kotlin/com/example/n_life
          cp android_widget/MainActivity.kt android/app/src/main/kotlin/com/example/n_life/MainActivity.kt
          cp android_widget/NLifeWidgetProvider.kt android/app/src/main/kotlin/com/example/n_life/NLifeWidgetProvider.kt
          cp android_widget/NLifeReminderReceiver.kt android/app/src/main/kotlin/com/example/n_life/NLifeReminderReceiver.kt
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable
          cp android_widget/nlife_widget.xml android/app/src/main/res/layout/nlife_widget.xml
          cp android_widget/nlife_widget_info.xml android/app/src/main/res/xml/nlife_widget_info.xml
          cp android_widget/nlife_widget_bg.xml android/app/src/main/res/drawable/nlife_widget_bg.xml

          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          for perm in [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]:
              if perm not in text:
                  text = text.replace('<application', f'    {perm}\n    <application', 1)

          widget = '''
                  <receiver android:name="com.example.n_life.NLifeWidgetProvider" android:label="N-Life Duty Widget" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/nlife_widget_info" />
                  </receiver>
          '''
          reminder = '''
                  <receiver android:name="com.example.n_life.NLifeReminderReceiver" android:enabled="true" android:exported="false" />
          '''
          if 'NLifeWidgetProvider' not in text:
              text = text.replace('</application>', widget + '\n    </application>')
          if 'NLifeReminderReceiver' not in text:
              text = text.replace('</application>', reminder + '\n    </application>')
          path.write_text(text)
          PY

          mkdir -p "$HOME/.android"
          cp android_signing/nlife_fixed_debug.keystore "$HOME/.android/debug.keystore"

      - name: Get Flutter packages
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze app source (report only)
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build N-Life v1.6.0 APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Life-v1.6.0-spms-exact-header-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
